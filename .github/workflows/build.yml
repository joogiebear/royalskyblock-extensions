name: Build

# Compile on every push/PR to main, so an unresolved dependency or a broken build
# is caught here rather than on the next deploy. Builds every adapter module.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Two hosts, because a release compiles against the host's latest RELEASE while day-to-day work
    # tracks the host's main. Building only against main let a PR go green on host API that no
    # release had yet, and the release then failed.
    #   release — what the next extensions release will compile against. This one gates.
    #   main    — early warning that the host is about to break an adapter. Reported, never blocks.
    name: Build (host ${{ matrix.host }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.host == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        host: [ release, main ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # RoyalSkyblock is not published to any Maven repository, so the host these adapters
      # compile against has to be built from source. It is a public repo, so the default token
      # is enough and no secret is involved.
      #
      # eco and paper-api are NOT handled this way: they come from repo.auxilor.io and
      # repo.papermc.io as published artifacts. Installing the shipped, shaded jars instead would
      # shadow the published ones — the local repository wins over remote — and the failure then
      # looks like the published artifact being broken.
      # Same resolution as the release workflow, so "green here" means "the release will build".
      - name: Resolve RoyalSkyblock ref
        id: host_ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.host }}" = "main" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOST_TAG=$(gh release view --repo joogiebear/RoyalSkyblock --json tagName --jq .tagName)
          [[ "$HOST_TAG" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid host release tag'; exit 1; }
          echo "Host release: $HOST_TAG"
          echo "ref=refs/tags/$HOST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out RoyalSkyblock
        uses: actions/checkout@v7
        with:
          repository: joogiebear/RoyalSkyblock
          ref: ${{ steps.host_ref.outputs.ref }}
          path: royalskyblock

      # The version installed here is the host's own, read from its gradle.properties, and it is
      # handed to the extensions build as -Proyalskyblock-version below. Nothing in this repo
      # names a host version: the pin in gradle.properties is a local-build default that a host
      # release would otherwise leave stale, and a stale pin fails as an unresolved dependency
      # rather than as anything that explains itself.
      - name: Build and install RoyalSkyblock
        id: host
        working-directory: royalskyblock
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew build --no-daemon
          HOST_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "Host version: $HOST_VERSION"
          echo "version=$HOST_VERSION" >> "$GITHUB_OUTPUT"
          mvn -q -B install:install-file \
            -Dfile=build/libs/RoyalSkyblock.jar \
            -DgroupId=com.mystipixel \
            -DartifactId=royalskyblock \
            -Dversion="$HOST_VERSION" \
            -Dpackaging=jar

      - name: Build
        run: |
          ./gradlew build --no-daemon \
            -Proyalskyblock-version=${{ steps.host.outputs.version }}

      - name: Upload jar
        if: matrix.host == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: extensions
          path: "*/build/libs/*.jar"
          if-no-files-found: error
